<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101519">
<title>Art · Maxwell Jann</title>
<link rel="icon" href="static/img/mj3.png">
<style>
:root{color-scheme:dark;--paper:#ede7d9;--brass:#dfbe82;--muted:#b5b6b0;--line:#ffffff24;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}body{margin:0;background:#101519;color:var(--paper);font:16px/1.5 system-ui,sans-serif}
button,a{font:inherit;color:inherit}a{text-underline-offset:4px}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #ffe2a3;outline-offset:4px}
.wrap{width:min(1250px,92%);margin:auto}header,footer,.bar,.tools,.choices,.viewer-foot,.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
header{min-height:66px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;font-weight:650;text-decoration:none}.brand img{width:29px;height:29px;object-fit:contain}nav{display:flex;gap:20px}nav a,footer a{font-size:.88rem;color:var(--muted)}a:hover{color:var(--brass)}
.hero{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.35fr);margin-top:26px;border:1px solid var(--line);background:radial-gradient(ellipse at 95% 40%,#21364a,transparent 66%),#101920}
.copy{padding:clamp(22px,4vw,58px);align-self:center}.eyebrow{color:var(--brass);font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;font-weight:640;margin:0}
h1,h2,h3,p{margin:0}h1,h2,h3,.work-name{font-family:var(--serif);font-weight:400}
h1{font-size:clamp(3.5rem,6.2vw,6.8rem);letter-spacing:-.065em;line-height:.96;margin:.2em 0}
.note{max-width:34ch;color:#c5c7be;min-height:3em}.action{display:inline-block;margin-top:22px;background:#e0cca4;color:#171c20;border:0;border-radius:2px;padding:.68em 1.05em;font-weight:650}.action:hover{background:#f4dfb2}
.choices{margin-top:clamp(22px,4vw,49px);justify-content:flex-start;gap:8px;flex-wrap:wrap}.thumb{border:1px solid #727574;background:#141c23;padding:3px;border-radius:2px}.thumb img{display:block;width:46px;height:36px;object-fit:cover}.thumb[aria-pressed=true]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.feature-art{padding:clamp(12px,2vw,30px);border:0;display:grid;place-items:center;min-width:0;background:radial-gradient(ellipse at center,#46504e 0%,#23303a 48%,#12191e 90%);cursor:zoom-in}
.feature-art img{width:100%;height:clamp(300px,31vw,440px);object-fit:contain;filter:drop-shadow(0 8px 10px #0007)}
.collection{padding:clamp(32px,5vw,68px) 0}.bar{align-items:baseline}.bar h2{font-size:clamp(2rem,4vw,3.6rem);letter-spacing:-.045em}.bar span{font-size:.82rem;color:var(--muted)}
.tools{justify-content:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:6px 0 22px;gap:4px 16px}.filter{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 1px;font-size:.9rem}.filter[aria-pressed=true]{color:var(--brass);border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:25px 18px}.card{display:block;width:100%;height:100%;border:0;padding:0;background:transparent;text-align:left;cursor:zoom-in}.mat{height:auto;aspect-ratio:5/4;display:grid;place-items:center;background:linear-gradient(130deg,#222c32,#191e22);border:1px solid var(--line);overflow:hidden}.mat img{width:100%;height:100%;min-height:0;object-fit:contain;transition:transform .35s}.card:hover .mat{border-color:#ab9166}.card:hover img{transform:scale(1.025)}.work-name{display:block;font-size:1.16rem;margin:7px 0}
footer{border-top:1px solid var(--line);padding:22px 0 34px;flex-wrap:wrap}
dialog{color:var(--paper);background:#12191d;border:1px solid #686453;width:min(1050px,95vw);max-height:95dvh;padding:clamp(12px,2vw,24px);overflow:auto}dialog::backdrop{background:#04080bec}.viewer-head{margin-bottom:10px}.viewer-head h2{font-size:clamp(1.15rem,3vw,1.9rem)}.viewer-img{display:block;object-fit:contain;width:100%;height:min(65vh,730px);background:#0b1013}.viewer-foot{flex-wrap:wrap;margin-top:12px}.viewer-foot div{display:flex;gap:12px;flex-wrap:wrap}.viewer-foot a{color:var(--brass);font-size:.9rem}.quiet{border:1px solid #65665d;background:transparent;padding:7px 12px;border-radius:2px}.quiet:hover{background:#273036}
@media(max-width:680px){.hero{display:flex;flex-direction:column-reverse}.feature-art img{height:clamp(190px,57vw,300px)}.copy{width:100%;padding:21px}.note{min-height:0}.choices{margin-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 10px}.work-name{font-size:1rem}.tools{gap:0 12px}.filter{font-size:.82rem}.viewer-img{height:55vh}nav{gap:13px}}
@media(prefers-reduced-motion:reduce){.mat img{transition:none}.card:hover img{transform:none}}
</style></head>
<body><div class="wrap">
<header><a class="brand" href="index.html"><img src="static/img/mj3.png" alt="">Max Jann</a><nav aria-label="Main"><a href="music.html">Music</a><a href="index.html">Home</a></nav></header>
<main>
<section class="hero" aria-label="Featured artwork">
<div class="copy"><p class="eyebrow">Featured artwork</p><h1 id="title">Elam Forever</h1><p class="note" id="note">A white blood cell of God saving the world.</p>
<button class="action" id="inspect">View artwork ↗</button><div class="choices" id="features" aria-label="Featured selections"></div></div>
<button class="feature-art" id="hero-open" aria-label="View Elam Forever"><img id="hero-image" src="static/img/ElamForever.png" fetchpriority="high" alt="Elam Forever"></button></section>
<section class="collection"><div class="bar"><h2>The collection</h2><span id="count" aria-live="polite"></span></div><div class="tools" id="filters" aria-label="Filter collection"></div><div class="grid" id="gallery"></div></section>
<noscript><p><a href="static/img/ElamForever.png">Open Elam Forever</a> · <a href="https://www.artstation.com/artwork/qAVB6D">View artwork on ArtStation</a></p></noscript>
</main><footer><a href="index.html">Max Jann · Home</a><a href="https://www.artstation.com/artwork/qAVB6D">Photoshop work on ArtStation ↗</a></footer></div>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><h2 id="viewer-title"></h2><button class="quiet" id="close" autofocus>Close ×</button></div><img class="viewer-img" id="full" alt=""><div class="viewer-foot"><div><a id="original" target="_blank" rel="noopener">Open original ↗</a><a id="related" href="https://youtu.be/nlPfmKerev4" target="_blank" rel="noopener" hidden>Watch related video ↗</a></div><div><button class="quiet" id="prev" aria-label="Previous artwork">←</button><button class="quiet" id="next" aria-label="Next artwork">→</button></div></div></dialog>
<script>
// Curate here. "feature" puts a work in the opening selection; "hidden" omits it
// from both displays. New images appear only when you add a row.
// Filename in static/img, display title, collection, optional status, optional caption.
const works = [
 ['ElamForever.png','Elam Forever','Characters','feature','A white blood cell of God saving the world.'],
 ['skytemple.png','Sky Temple','Worlds','feature','A temple above the clouds of Cloudland.'],
 ['rosecloud.png','Cloudland','Trading cards','feature','Cloudland in its trading-card form.'],
 ['auri.webp','Auri','Characters'], ['panfury.png','Panfury','Characters'],
 ['altposter.png','Alternate Poster','Studies'], ['pegasus.jpg','Pegasus','Characters'],
 ['Aurora and Tigon.png','Aurora and Tigon','Characters'], ['LedgeofKnow.png','Ledge of Knowledge','Worlds'],
 ['butterflyman.png','Butterfly Man','Characters'], ['panthos.png','Panthos','Characters'],
 ['midj1.png','Midjourney Study I','Studies'], ['vmanreal.png','V-Man','Characters'],
 ['craigteroh.png','Craig Teroh','Characters'], ['RainbowAngel.png','Rainbow Angel','Characters'],
 ['a2.png','A2','Studies'], ['The_One_TradingCard copy 3.jpg','The One','Trading cards'],
 ['King_Elam_TradingCard copy.jpg','King Elam','Trading cards'], ['Elam_the_Dragonslayer_2.jpg','Elam the Dragonslayer','Trading cards'],
 ['midj2.png','Midjourney Study II','Studies'], ['midj3.png','Midjourney Study III','Studies'],
 ['midj4.png','Midjourney Study IV','Studies'], ['midj5.png','Midjourney Study V','Studies'],
 ['jag.jpg','Jag','Photoshop'], ['worldball.jpg','Worldball','Photoshop'], ['jp.jpg','JP','Photoshop'],
 ['fishbulb.jpg','Fishbulb','Photoshop'], ['tiger.jpg','Tiger','Photoshop'],
 ['Elam117.png','Elam 117','Characters'], ['grid.png','Grid','Studies'], ['vengeance.png','Vengeance','Characters'],
 ['spiderguns.jpg','Spiderguns','Studies','hidden']
];
const visible = works.filter(work => work[3] !== 'hidden');
const picks = visible.filter(work => work[3] === 'feature');
const groupNames = ['All', ...new Set(visible.map(work => work[2]))];
const byId = id => document.getElementById(id);
const url = work => 'static/img/' + encodeURIComponent(work[0]);
let featured = picks[0] || visible[0];
let selection = visible;
let viewing = [];
let position = 0;
function button(className,label,action) {
    const b=document.createElement('button');
    b.type='button'; b.className=className; b.setAttribute('aria-label',label);
    b.addEventListener('click',action); return b;
}
function artwork(work,lazy) {
    const image=new Image();
    if(lazy) image.loading='lazy';
    image.decoding='async'; image.alt=''; image.src=url(work);
    return image;
}
function showFeature(work) {
    featured=work;
    byId('title').textContent=work[1]; byId('note').textContent=work[4] || '';
    byId('hero-image').src=url(work); byId('hero-image').alt=work[1];
    byId('hero-open').setAttribute('aria-label','View '+work[1]);
    [...byId('features').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(picks[i]===work)));
}
function showGroup(group) {
    selection=group==='All'?visible:visible.filter(work=>work[2]===group);
    for(const b of byId('filters').children) b.setAttribute('aria-pressed', String(b.textContent===group));
    byId('count').textContent=selection.length+' works';
    const cards=selection.map(work=>{
        const b=button('card','View '+work[1],()=>openViewer(work,selection));
        const mat=document.createElement('span'); mat.className='mat'; mat.append(artwork(work,true));
        const title=document.createElement('span'); title.className='work-name'; title.textContent=work[1];
        b.append(mat,title); return b;
    });
    byId('gallery').replaceChildren(...cards);
}
function paintViewer() {
    const work=viewing[position];
    byId('viewer-title').textContent=work[1]; byId('full').src=url(work); byId('full').alt=work[1];
    byId('original').href=url(work); byId('related').hidden=work[0]!=='jp.jpg';
    byId('prev').disabled=byId('next').disabled=viewing.length<2;
}
function openViewer(work,list) {
    viewing=list; position=list.indexOf(work); paintViewer(); byId('viewer').showModal();
}
function step(n) {position=(position+n+viewing.length)%viewing.length;paintViewer();}
for(const work of picks) {
    const b=button('thumb','Feature '+work[1],()=>showFeature(work));
    b.title=work[1]; b.append(artwork(work,false)); byId('features').append(b);
}
for(const group of groupNames) {
    const b=button('filter',group,()=>showGroup(group)); b.textContent=group; byId('filters').append(b);
}
if(featured) showFeature(featured);
showGroup('All');
byId('inspect').onclick=byId('hero-open').onclick=()=>openViewer(featured,picks.length?picks:visible);
byId('close').onclick=()=>byId('viewer').close();
byId('prev').onclick=()=>step(-1); byId('next').onclick=()=>step(1);
byId('viewer').addEventListener('keydown',event=>{
    if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();step(event.key==='ArrowRight'?1:-1);}
});
</script></body></html>
