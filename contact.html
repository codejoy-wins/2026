<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101211">
<title>Contact · Maxwell Lawrence Jann</title>
<link rel="icon" href="static/img/mj3.png">
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #eee9dc; }
body {
    margin: 0; min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center; padding: 32px 16px;
    background: radial-gradient(ellipse at 50% 42%, #292a24, #121513 49%, #0b0d0d 90%);
}
main { width: min(100%, 31rem); text-align: center; }
.stage { perspective: 920px; cursor: pointer; }
.tilt, .card { transform-style: preserve-3d; }
.tilt {
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 180ms ease-out;
}
.card {
    position: relative; min-height: 14.5rem; aspect-ratio: 1.68;
    transform: rotateY(0deg); transition: transform 680ms cubic-bezier(.22,.7,.2,1);
}
.stage.flipped .card { transform: rotateY(180deg); }
.face {
    position: absolute; inset: 0; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    padding: clamp(22px, 6vw, 38px); border-radius: 15px;
    border: 1px solid #85754f; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 24px 45px -22px #000;
}
.face::after {
    content: ""; position: absolute; inset: 7px; border: 1px solid #c6ac7338;
    border-radius: 9px; pointer-events: none;
}
.front {
    justify-content: flex-end;
    background: linear-gradient(90deg, #121e23 2%, #132127e8 44%, #121e23a8),
                url('static/img/sensa.jpeg') center / cover, #172730;
}
.front::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at var(--light-x,70%) var(--light-y,20%), #ffe7a919, transparent 58%);
}
.mark { position: absolute; right: 7%; top: 11%; width: 18%; height: 29%; object-fit: contain; }
.eyebrow { font: 600 .68rem/1.3 system-ui, sans-serif; letter-spacing: .21em; text-transform: uppercase; color: #ddc48d; }
h1, h2 { margin: .4rem 0 0; font: normal clamp(2.5rem,7vw,4rem)/1 Georgia, serif; letter-spacing: -.048em; }
.back {
    justify-content: center; transform: rotateY(180deg);
    background: linear-gradient(120deg, #202521, #111917 80%);
}
h2 { font-size: clamp(1.55rem, 5.2vw, 2.45rem); margin-bottom: .65rem; }
address { font-style: normal; }
address a {
    display: table; padding: .4rem 0; font-size: clamp(.9rem,3.5vw,1.05rem);
    color: #e9dec5; text-decoration-color: #887650; text-underline-offset: .24em;
    overflow-wrap: anywhere;
}
address a:hover { color: #ffdc91; }
button {
    margin-top: 1.25rem; padding: .7rem 1rem; background: none; border: 0;
    color: #cab997; font: inherit; font-size: .87rem; cursor: pointer;
}
button:hover { color: #ffdfa2; }
:focus-visible { outline: 2px solid #f4cd7c; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
    .tilt { transform: none; }
    .tilt, .card { transition: none; }
}
</style>
</head>
<body>
<main>
    <div class="stage">
        <div class="tilt">
            <div class="card">
                <div class="face front">
                    <img class="mark" src="static/img/mj3.png" alt="" onerror="this.hidden=true">
                    <span class="eyebrow">Contact card</span>
                    <h1>Max Jann</h1>
                </div>
                <section class="face back" id="details" inert aria-label="Contact details">
                    <span class="eyebrow">Get in touch</span>
                    <h2>Maxwell Lawrence Jann</h2>
                    <address>
                        <a href="mailto:maxwellljann@gmail.com">maxwellljann@gmail.com</a>
                        <a href="tel:+18059405096">805 940 5096</a>
                    </address>
                </section>
            </div>
        </div>
    </div>
    <button type="button" aria-controls="details" aria-expanded="false">Flip to contact details ↻</button>
</main>
<script>
const stage = document.querySelector('.stage');
const front = stage.querySelector('.front');
const back = stage.querySelector('.back');
const flipButton = document.querySelector('button');
const motion = matchMedia('(prefers-reduced-motion: reduce)');

function flip() {
    const showingDetails = stage.classList.toggle('flipped');
    front.inert = showingDetails;
    back.inert = !showingDetails;
    flipButton.setAttribute('aria-expanded', String(showingDetails));
    flipButton.textContent = showingDetails ? 'Flip back ↻' : 'Flip to contact details ↻';
    if (showingDetails && document.activeElement === flipButton) back.querySelector('a').focus();
}
flipButton.addEventListener('click', flip);
stage.addEventListener('click', event => {
    if (!event.target.closest('a')) flip();
});

// Measure the stationary stage so tilting the card never shifts its hit coordinates.
stage.addEventListener('pointermove', event => {
    if (event.pointerType === 'touch' || motion.matches) return;
    const rect = stage.getBoundingClientRect();
    const x = Math.max(-1, Math.min(1, 2 * (event.clientX - rect.left) / rect.width - 1));
    const y = Math.max(-1, Math.min(1, 2 * (event.clientY - rect.top) / rect.height - 1));
    stage.style.setProperty('--rx', (y * 9) + 'deg');
    stage.style.setProperty('--ry', (x * 12) + 'deg');
    stage.style.setProperty('--light-x', (50 - 42 * x) + '%');
    stage.style.setProperty('--light-y', (50 - 42 * y) + '%');
});
function settle() {
    for (const prop of ['--rx', '--ry', '--light-x', '--light-y']) stage.style.removeProperty(prop);
}
stage.addEventListener('pointerleave', settle);
stage.addEventListener('pointercancel', settle);
motion.addEventListener('change', settle);
</script>
</body>
</html>
